name: Controller release candidate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/release/**'
      - '.github/workflows/release-candidate.yml'
      - '.github/workflows/release.yml'
      - 'Directory.Build.*'
      - 'Directory.Packages.props'
      - 'global.json'
      - 'src/Knightfall.ScaleSet.Aws.Controller/*.csproj'
      - 'tests/oci/**'
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  build:
    name: Build and smoke-test ${{ matrix.rid }}
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            runner: ubuntu-24.04
          - rid: linux-arm64
            runner: ubuntu-24.04-arm
    env:
      RID: ${{ matrix.rid }}
      BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BUILD_SHA }}
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Set up the Docker containerd image store
        uses: docker/setup-docker-action@3f1ab1ab0e29231562e4db4ca600c1a49653bac6 # v5.7.0
        with:
          set-host: true
          daemon-config: '{"features":{"containerd-snapshotter":true}}'
      - name: Build, inspect and smoke-test the OCI archive
        run: bash .github/release/build-controller.sh "$RID" "$RUNNER_TEMP/controller"
      - uses: anchore/scan-action/download-grype@11983a512817154c80a9db660c1a184be7513ed6 # v7.4.3
        id: grype
        with:
          grype-version: v0.122.1
      - name: Scan the tested OCI archive
        id: scan
        env:
          GRYPE: ${{ steps.grype.outputs.cmd }}
          GRYPE_DB_VALIDATE_AGE: 'true'
          GRYPE_DB_REQUIRE_UPDATE_CHECK: 'true'
        run: |
          archive="$RUNNER_TEMP/controller/scaleset-aws-controller-$RID.tar.gz"
          "$GRYPE" "oci-archive:$archive" --fail-on high --output json --file "${archive%.tar.gz}.grype.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure() && steps.scan.outcome == 'failure'
        with:
          name: controller-scan-failed-${{ matrix.rid }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/controller/scaleset-aws-controller-${{ matrix.rid }}.grype.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Inventory the tested image
        uses: anchore/sbom-action@dfcb83b97731532d72be422cbc51ee64adb6fd56 # v0.24.4
        with:
          image: docker:scaleset-aws-controller:git-${{ env.BUILD_SHA }}-${{ matrix.rid }}
          syft-version: v1.57.2
          format: spdx-json
          output-file: ${{ runner.temp }}/controller/scaleset-aws-controller-${{ matrix.rid }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: controller-${{ matrix.rid }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/controller/
          if-no-files-found: error
          retention-days: 14

  candidate:
    name: Seal the exact main candidate
    if: github.repository == 'knightfall/scaleset-dotnet-aws' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: controller-linux-*-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate
          merge-multiple: true
      - name: Record and verify checksums, source and run identity
        run: |
          cp LICENSE "$RUNNER_TEMP/candidate/LICENSE"
          for operation in prepare verify; do
            python3 .github/release/candidate.py "$operation" "$RUNNER_TEMP/candidate" \
              --commit "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"
          done
      - name: Attest the release manifest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/candidate/release.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: controller-candidate-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate/
          if-no-files-found: error
          retention-days: 30
