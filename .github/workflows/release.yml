name: Publish controller release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing protected release tag at this main commit
        required: true
        type: string
      candidate_run_id:
        description: Successful Controller release candidate run ID at this commit
        required: true
        type: string

permissions: {}

concurrency:
  group: publish-controller-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'knightfall/scaleset-dotnet-aws' && github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      attestations: read
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify protections, tag and exact candidate and CI runs
        id: preflight
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SETTINGS_READ_TOKEN: ${{ secrets.RELEASE_SETTINGS_READ_TOKEN }}
        run: bash .github/release/preflight.sh
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.preflight.outputs.artifact_id }}
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/candidate
          merge-multiple: true
      - name: Verify provenance and all release bytes
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_ATTEMPT: ${{ steps.preflight.outputs.attempt }}
        run: |
          gh attestation verify "$RUNNER_TEMP/candidate/release.json" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release-candidate.yml" \
            --source-ref refs/heads/main --source-digest "$GITHUB_SHA" --deny-self-hosted-runners
          python3 .github/release/candidate.py verify "$RUNNER_TEMP/candidate" \
            --commit "$GITHUB_SHA" --run-id "$CANDIDATE_RUN_ID" --attempt "$CANDIDATE_ATTEMPT"
      - name: Publish verified assets to the existing tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source .github/release/tag.sh
          require_release_tag "$RELEASE_TAG" "$GITHUB_SHA"
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            flags+=(--prerelease --latest=false)
          fi
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --generate-notes "${flags[@]}" "$RUNNER_TEMP/candidate"/*
