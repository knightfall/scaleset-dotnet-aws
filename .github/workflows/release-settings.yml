name: Check production release settings

on:
  workflow_dispatch:

permissions: {}

jobs:
  scope:
    name: Require the credential to be exclusive to production
    if: github.repository == 'knightfall/scaleset-dotnet-aws' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Reject a repository or organization credential with the same name
        env:
          RELEASE_SETTINGS_OUTSIDE_PRODUCTION: ${{ secrets.RELEASE_SETTINGS_READ_TOKEN != '' }}
        run: |
          if [[ "$RELEASE_SETTINGS_OUTSIDE_PRODUCTION" != false ]]; then
            printf '%s\n' '::error::Configure RELEASE_SETTINGS_READ_TOKEN only in the production environment.'
            exit 1
          fi

  settings:
    name: Check the stored production credential before tagging
    needs: scope
    if: github.repository == 'knightfall/scaleset-dotnet-aws' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment:
      name: production
      deployment: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify the current repository rules
        env:
          RELEASE_SETTINGS_READ_TOKEN: ${{ secrets.RELEASE_SETTINGS_READ_TOKEN }}
        run: bash .github/release/production.sh --settings-only
